[package]
name = "zodb-json-codec"
version = "1.7.0"
edition = "2021"
description = "Fast pickle ↔ JSON transcoder for ZODB, implemented in Rust"
readme = "README.md"
license = "MIT"
repository = "https://github.com/bluedynamics/zodb-json-codec"
homepage = "https://github.com/bluedynamics/zodb-json-codec"

[lib]
name = "zodb_json_codec"
crate-type = ["cdylib"]

[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "num-bigint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
num-bigint = "0.4"
ryu = "1"
itoa = "1"
# local_dynamic_tls: the extension is dlopen'ed; initial-exec TLS would claim part of
# glibc's fixed static-TLS surplus and can fail imports ("cannot allocate memory in
# static TLS block") once other modules have used it up.
# Pinned exactly: the mimalloc v2 to v3 switch happened inside the 0.1 series and the
# two differ in speed and purge behaviour; bump deliberately, with a benchmark.
mimalloc = { version = "=0.1.52", default-features = false, features = ["local_dynamic_tls"] }
