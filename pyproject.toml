[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "zodb-json-codec"
dynamic = ["version"]
description = "Fast pickle to JSON transcoder for ZODB, implemented in Rust"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Jens W. Klein", email = "jk@kleinundpartner.at" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Framework :: ZODB",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/bluedynamics/zodb-json-codec"
Repository = "https://github.com/bluedynamics/zodb-json-codec"
Changelog = "https://github.com/bluedynamics/zodb-json-codec/blob/main/CHANGES.md"
Issues = "https://github.com/bluedynamics/zodb-json-codec/issues"

[project.optional-dependencies]
test = [
    "pytest",
    "persistent",
    "ZODB",
    "BTrees",
    "pytz",
]
bench = [
    "ZODB",
    "BTrees",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "zodb_json_codec._rust"

[tool.ruff.format]
# Keep the formatter Python-only: code fences in the docs are prose
# examples, not format-enforced (ruff >= 0.16 formats Markdown by default).
exclude = ["*.md"]

[tool.ruff.lint]
# Pinned explicitly (classic ruff defaults plus C901) so results do not
# drift with ruff's expanding default rule set.
select = [
    "C901",
    "E4",
    "E7",
    "E9",
    "F",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"benchmarks/*" = ["C901"]
